# Local backing services, matching production (https://12factor.net/dev-prod-parity)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: url_shortener
      POSTGRES_DB: url_shortener
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_shortener"]
      interval: 2s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://url_shortener:url_shortener@db:5432/url_shortener
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
