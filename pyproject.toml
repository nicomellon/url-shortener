[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "url-shortener"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
  {name = "Nico Mellon", email = "nmellon94@gmail.com"},
]
dependencies = [
  "fastapi[standard]",
  "prometheus-client>=0.26.0",
  "psutil>=7.2.2",
  "psycopg[binary]",
  "pydantic-settings",
  "sqlalchemy>=2.0",
  "uvicorn",
]

[project.scripts]
url-shortener-api = "url_shortener.entrypoints.fastapi_app:main"
url-shortener-admin = "url_shortener.entrypoints.admin:main"

[dependency-groups]
dev = [
  "import-linter",
  "mypy",
  "pytest",
  "ruff",
  "types-psutil>=7.2.2.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "B",       # flake8-bugbear
  "UP",      # pyupgrade
  "SIM",     # flake8-simplify
]

[tool.mypy]
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.importlinter]
root_package = "url_shortener"
include_external_packages = true

# The dependency rule: each layer only imports from layers below it. Views and the
# service layer sit side by side ("|") and must not import each other.
[[tool.importlinter.contracts]]
name = "Layers only depend downwards"
type = "layers"
layers = [
  "url_shortener.entrypoints",
  "url_shortener.views | url_shortener.service_layer",
  "url_shortener.adapters",
  "url_shortener.domain",
]

[[tool.importlinter.contracts]]
name = "Domain models are pure Python"
type = "forbidden"
source_modules = ["url_shortener.domain"]
forbidden_modules = [
  "sqlalchemy",
  "fastapi",
  "pydantic",
  "pydantic_settings",
  "url_shortener.config",
]
